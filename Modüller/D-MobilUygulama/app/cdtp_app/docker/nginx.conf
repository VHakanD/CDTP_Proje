server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web tek sayfa uygulamasi: bilinmeyen yollar index.html'e gider.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html onbellege alinmaz; yeni derleme hemen gorunur.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
