name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  app:
    name: Analiz, test ve web derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platform klasorleri + paketler + uretilen kod
        run: sh tool/bootstrap.sh

      - name: Analiz
        run: flutter analyze --no-fatal-infos

      - name: Birim testleri
        run: flutter test

      - name: Web derlemesi
        run: flutter build web --release

  android:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: sh tool/bootstrap.sh

      - name: APK derle
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: cdtp-robot-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  simulator:
    name: Robot simulatoru
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/robot_simulator
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart compile exe bin/robot_simulator.dart -o robot_simulator
